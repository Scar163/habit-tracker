name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        run: |
          mkdir -p ~/.android keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name github-actions
            git config user.email actions@github.com
            git add keystore/debug.keystore
            git commit -m "Add signing key"
            git push
          fi
          cp keystore/debug.keystore ~/.android/debug.keystore
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html sw.js manifest.json icons.webp icon-192.png icon-512.png apple-touch-icon.png 1.jpg 2.jpg 3.jpg 4.jpg 5.jpg 6.jpg www/
      - run: npx cap add android
      - run: python3 native/patch.py
        env:
          RUN: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk habit-tracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest habit-tracker.apk --title "Habit Tracker for Android" --notes "Build ${{ github.run_number }}" --latest
