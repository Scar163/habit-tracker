<style>
:root{--ac:#fbbf24;--bg:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{color:#fff;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;background:#111;overflow:hidden}
#bg{position:fixed;inset:0;background:var(--bg) center/cover no-repeat;transition:background .4s}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
#app{position:relative;max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top h1{font-size:19px;margin:0;font-weight:600}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:19px;backdrop-filter:blur(8px)}
.glass{background:rgba(15,15,25,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}
.hero{display:flex;align-items:center;gap:18px;margin:8px 4px 14px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:30px}.ring span{font-size:13px;opacity:.85}
.hero h2{margin:0;font-size:21px}.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.week{display:flex;gap:6px;margin-bottom:14px}
.week button{flex:1;border:0;border-radius:10px;padding:6px 0;background:rgba(0,0,0,.35);color:#fff;font-size:12px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(8px)}
.week button b{font-size:16px}
.week button.sel{background:var(--ac);color:#111}
.week button:disabled{opacity:.4}
.sect{display:flex;justify-content:space-between;margin:6px 4px;font-weight:600}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border:0}
.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.row small{display:block;opacity:.65;font-size:12px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:none;color:#111;font-size:16px;flex:none;padding:0}
.chk.on{background:var(--ac);border-color:var(--ac)}
.x{border:0;background:none;color:#fca5a5;font-size:18px}
.done .n{text-decoration:line-through;opacity:.6}
.add{display:flex;gap:8px;padding:10px 12px}
.add input{flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-size:16px}
.add button,.btn{padding:11px 16px;border-radius:10px;border:0;background:var(--ac);color:#111;font-weight:700;font-size:15px}
.btn.g{background:rgba(255,255,255,.15);color:#fff}
nav{display:flex;margin:0 12px calc(10px + env(safe-area-inset-bottom));padding:6px}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}
nav button.a{opacity:1;color:var(--ac)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.th{height:70px;border-radius:12px;border:3px solid transparent;background-size:cover;background-position:center;color:#fff;font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;text-shadow:0 1px 3px #000}
.th.on{border-color:#fff}
.seg{display:flex;gap:8px;padding:12px}.seg button{flex:1}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.empty{text-align:center;opacity:.7;padding:22px}
h3{margin:16px 4px 6px;font-size:15px;opacity:.85}
.icb{width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.12);font-size:20px;padding:0;flex:none}
.add .icb{background:rgba(255,255,255,.14);font-size:22px;padding:0;color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:488px;margin:0 auto;background:var(--ac);color:#111;font-weight:700;padding:14px;border-radius:14px;text-align:center;z-index:30}
.mb{background:none;border:0;color:#fff;opacity:.7;font-size:22px;padding:4px 8px;flex:none}
.ico{font-size:22px;flex:none;display:inline-flex}
.spi{display:inline-block;border-radius:22%;flex:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.pk{background:#1b1b2b;width:100%;max-width:520px;max-height:80vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px}
.ig{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.ig button{background:rgba(255,255,255,.06);border:0;border-radius:10px;font-size:24px;padding:6px 0}
.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.chev{opacity:.5;font-size:20px}
.ok{color:#4ade80}.no{color:#f87171}
.dayrow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.dayrow:last-child{border:0}
.wk{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.pct{font-size:11px;opacity:.85;font-weight:400}
.week button.has b{font-size:16px}
[dir=rtl] .top,[dir=rtl] .row{direction:rtl}

    const mi=Math.min(4,Math.floor(p/25)),R=56,C=2*Math.PI*R;
    h+=`<div class="top"><span style="width:40px"></span><h1>${t.app}</h1><button class="ib" data-tab="prof">⚙</button></div>
    <div class="hero"><div class="ring"><svg width="132" height="132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="10"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}"/></svg><div class="tx"><b>${p}%</b><span>${t.today}</span></div></div>
    <div><h2>${t.m[mi]}</h2><p>${t.m2[mi]}</p></div></div><div class="week">`;
    wkDays(0).forEach(d=>{const k=key(d);h+=`<button data-d="${k}" class="${k==sel?'sel':''}" ${k>tk?'disabled':''}>${fd(d,{weekday:'short'})}<b>${d.getDate()}</b></button>`});
    h+=`</div><div class="sect"><span>${t.tasks}</span><span>${tdn}/${tl.length}</span></div><div class="list glass">`;
    if(!tl.length)h+=`<div class="empty">${t.noT}</div>`;
    D.tasks.forEach((x,i)=>{if(x.d!=sel)return;h+=`<div class="row ${x.done?'done':''}"><div class="n">${esc(x.name)}</div><button class="x" data-tx="${i}">✕</button><button class="chk ${x.done?'on':''}" data-tk="${i}">${x.done?'✓':''}</button></div>`});
    h+=`<form class="add" data-f="t"><input placeholder="${t.addT}" autocomplete="off"><button>+</button></form></div>
    <div class="sect" style="margin-top:22px"><span>${t.habits}</span><span>${dn}/${n}</span></div><div class="list glass">`;
    if(!n)h+=`<div class="empty">${t.noH}</div>`;
    D.habits.forEach((x,i)=>{const sb=x.sub||[],sc=sb.filter(y=>y.log[sel]).length;h+=`<div class="row"><span class="ico">${ic(hi(x))}</span><div class="n" data-hd="${i}" style="cursor:pointer">${esc(hn(x))}<small>${t.streak}: ${streak(x)} ${t.days}${sb.length?` · ${sc}/${sb.length}`:''}${x.rm?` · ⏰ ${x.rm}`:''}</small></div><button class="mb" data-mn="h:${i}">⋯</button><button class="chk ${x.log[sel]?'on':''}" data-h="${i}">${x.log[sel]?'✓':''}</button></div>`});
    h+=`<form class="add" data-f="h"><button type="button" class="icb" data-pk="nh">${ic(ni)}</button><input placeholder="${t.addH}" autocomplete="off"><button>+</button></form></div>
    <button class="btn" style="width:100%;margin-top:12px" data-tab="sug">💡 ${t.sugBtn}</button>`;
  }else if(tab=='sug'){
    const ru=D.lang=='ru',lv=ru?['','Слабая','Средняя','Хорошая']:['','Weak','Medium','Good'];
    h+=`<div class="top"><button class="ib" data-tab="home">←</button><h1>${t.sugTitle}</h1><span style="width:40px"></span></div>
    <div class="week" style="flex-wrap:wrap">`+[['all',t.all],...Object.entries(GR).map(([k,v])=>[k,v[ru?0:1]])].map(([k,l])=>`<button data-sf="${k}" class="${sugF==k?'sel':''}" style="flex:none;padding:8px 14px;font-size:14px">${l}</button>`).join('')+`</div>`;
    SUG.filter(x=>sugF=='all'||x.g==sugF).forEach(x=>{
      const has=D.habits.some(y=>y.s==x.id||y.k==x.id);
      h+=`<div class="glass" style="padding:12px 14px;margin-bottom:10px"><div style="display:flex;gap:10px;align-items:center">${ic(x.i,32)}<b style="flex:1">${x.n[ru?0:1]}</b><button class="btn" data-add="${x.id}" ${has?'disabled style="opacity:.5"':''}>${has?'✓':'+'}</button></div>
      <div style="font-size:13px;opacity:.85;margin-top:8px">${x.w[ru?0:1]}</div>
      <div style="font-size:12px;opacity:.65;margin-top:6px">${t.rel}: ${lv[x.s]} · <a href="${x.u}" target="_blank" rel="noopener" style="color:var(--ac)">${x.a[ru?0:1]}</a></div></div>`});
    h+=`<div style="font-size:12px;opacity:.6;margin:8px 4px 16px">${t.disc}</div>`;
  }else if(tab=='stats'){
    const days=wkDays(wk),keys=days.map(key);
    if(!sd||!keys.includes(sd))sd=keys.includes(tk)?tk:keys[0];
    const dp=k=>{const hs=D.habits.filter(x=>cnt(x,k,tk));return[hs.filter(x=>x.log[k]).length,hs.length]};
    let td=0,tc=0;keys.forEach(k=>{const[a,b]=dp(k);td+=a;tc+=b});
    const wp=tc?Math.round(td/tc*100):0;
    h+=`<div class="top"><span style="width:40px"></span><h1>${t.stats}</h1><span style="width:40px"></span></div>
    <div class="wk"><button class="ib" data-wk="-1">‹</button><b>${fd(days[0],{day:'numeric',month:'short'})} – ${fd(days[6],{day:'numeric',month:'short'})}</b><button class="ib" data-wk="1" ${wk>=0?'disabled style="opacity:.4"':''}>›</button></div><div class="week">`;
    days.forEach((d,i)=>{const k=keys[i],[a,b]=dp(k);h+=`<button data-sd="${k}" class="${k==sd?'sel':''}" ${k>tk?'disabled':''}>${fd(d,{weekday:'short'})}<b>${d.getDate()}</b><span class="pct">${b?Math.round(a/b*100)+'%':'–'}</span></button>`});
    const sdd=new Date(sd+'T12:00:00'),[da,db]=dp(sd);
    h+=`</div><div class="sect"><span>${fd(sdd,{weekday:'long',day:'numeric',month:'long'})}</span><span>${da}/${db}</span></div><div class="list glass">`;
    const hs=D.habits.filter(x=>cnt(x,sd,tk)),dn=hs.filter(x=>x.log[sd]),ms=hs.filter(x=>!x.log[sd]);
    if(!hs.length)h+=`<div class="empty">–</div>`;
    dn.forEach(x=>{h+=`<div class="dayrow"><span class="ok">✓</span><span class="ico">${ic(hi(x))}</span><span style="flex:1">${esc(hn(x))}</span><small class="ok">${t.done}</small></div>`});
    ms.forEach(x=>{h+=`<div class="dayrow"><span class="no">✗</span><span class="ico">${ic(hi(x))}</span><span style="flex:1">${esc(hn(x))}</span><small class="no">${t.missed}</small></div>`});
    h+=`</div><div class="sect" style="margin-top:14px"><span>${t.weekSum}</span><span>${wp}%</span></div><div class="list glass">`;
    if(!D.habits.length)h+=`<div class="empty">${t.noH}</div>`;
    D.habits.forEach(x=>{let c=0,n=0;keys.forEach(k=>{if(cnt(x,k,tk)){n++;if(x.log[k])c++}});
      h+=`<div class="row"><span class="ico">${ic(hi(x))}</span><div class="n">${esc(hn(x))}<small>${c}/${n} · ${t.best}: ${best(x)} ${t.days}</small><div class="bar"><i style="width:${n?c/n*100:0}%"></i></div></div></div>`});
    h+='</div>';
  }else if(tab=='goals'){
    const L2=gl(),open=L2.filter(x=>!x.d).length;
    h+=`<div class="top">${gp.length?`<button class="ib" data-gb="1">←</button>`:`<span style="width:40px"></span>`}<h1>${gp.length?esc(gTitle()):t.goals}</h1><span style="width:40px"></span></div>
    <div class="sect"><span>${t.left}</span><span>${open}</span></div><div class="list glass">`;
    if(!L2.length)h+=`<div class="empty">${t.noG}</div>`;
    L2.forEach((x,i)=>{const c=x.c||[],cd=c.filter(y=>y.d).length;
      h+=`<div class="row ${x.d?'done':''}"><button class="chk ${x.d?'on':''}" data-g="${i}">${x.d?'✓':''}</button><span class="ico">${ic(x.i||'sp:28')}</span><div class="n" data-go="${i}" style="cursor:pointer">${esc(x.name)}${(c.length||x.r||x.rm)?`<small>${c.length?cd+'/'+c.length:''}${x.r?` 🎁 ${esc(x.r)}`:''}${x.rm?` ⏰ ${x.rm}`:''}</small>`:''}</div><button class="mb" data-mn="g:${i}">⋯</button></div>`});
    h+=`<form class="add" data-f="g"><button type="button" class="icb" data-pk="ng">${ic(ng)}</button><input placeholder="${gp.length?t.subAdd:t.addG}" autocomplete="off"><button>+</button></form></div>`;
  }else{
    h+=`<div class="top"><span style="width:40px"></span><h1>${t.prof}</h1><span style="width:40px"></span></div>
    <h3>${t.theme}</h3><div class="themes glass">`;
    TH.forEach((x,i)=>{h+=`<button class="th ${i==D.theme?'on':''}" data-th="${i}" style="background:url('${i+1}.jpg') center/cover,${x.g}">${x.n[D.lang=='ru'?0:1]}</button>`});
    h+=`</div><h3>${t.lang}</h3><div class="lg glass">`+LANGS.map(([c,n])=>`<button class="btn ${D.lang==c?'':'g'}" data-l="${c}">${n}</button>`).join('')+`</div>
    <h3>${t.remTitle}</h3><div class="glass" style="padding:12px 14px;font-size:13px;line-height:1.5">${NATIVE?'':`<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="https://github.com/Scar163/habit-tracker/releases/latest/download/habit-tracker.apk">⬇ ${t.dlApp}</a>`}<div style="opacity:.85">⏰ ${t.remHint}</div><div style="opacity:.85;margin-top:6px">🧩 ${t.wdHint}</div></div>
    <h3>${t.backup}</h3><div class="seg glass"><button class="btn g" data-a="save">${t.save}</button><button class="btn g" data-a="load">${t.load}</button></div><input type="file" id="file" accept=".json" hidden>`;
  }
  if(pk)h+=pickerHTML();
  if(mn)h+=menuHTML();
  if(rv)h+=remindHTML();
  if(tm)h+=`<div class="toast">🎉 ${esc(tm)}</div>`;
  m.innerHTML=h;
  nav.innerHTML=[['home','sp:56',t.home],['stats','sp:25',t.stats],['goals','sp:98',t.goals],['prof','sp:96',t.prof]].map(([k,i,l])=>`<button data-tab="${k}" class="${tab==k?'a':''}"><i>${ic(i,26)}</i>${l}</button>`).join('');
}
const m=document.getElementById('m'),nav=document.getElementById('nav');
const app=document.getElementById('app');
function pick(e){const p=pk;pk=null;if(p=='nh')ni=e;else if(p=='ng')ng=e;else{const[t,i]=p.split(':');if(t=='h')D.habits[i].i=e;else gl()[i].i=e}}
app.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('ov')){pk=null;mn=null;rv=null;render();return}
  const b=e.target.closest('button,[data-go],[data-hd]');if(!b)return;const d=b.dataset;
  if(d.pi)pick(d.pi);
  else if(d.pc)pk=null;
  else if(d.pk)pk=d.pk;
  else if(d.mn)mn=d.mn;
  else if(d.mcx){mn=null;rv=null}
  else if(d.rs){const[ty,i]=rv.split(':'),o=(ty=='h'?D.habits:gl())[i],v=document.getElementById('rt').value;o.rm=v||null;if(o.rm)nidOf(o);rv=null;save();render();syncRem();return}
  else if(d.rd){const[ty,i]=rv.split(':'),o=(ty=='h'?D.habits:gl())[i];o.rm=null;rv=null;save();render();syncRem();return}
  else if(d.mc){const[ty,i]=mn.split(':'),arr=ty=='h'?D.habits:gl(),o=arr[i];
    if(d.mc=='icon'){pk=mn;mn=null}
    else if(d.mc=='remind'){rv=mn;mn=null}
    else if(d.mc=='reward'){const v=prompt(T().rewardAsk,o.r||'');mn=null;if(v!==null){o.r=v.trim()||undefined}}
    else if(d.mc=='rename'){const v=prompt(T().rename,ty=='h'?hn(o):o.name);mn=null;if(v&&v.trim()){if(ty=='h'){o.i=hi(o);delete o.k;delete o.s}o.name=v.trim()}}
    else if(d.mc=='del'){if(confirm(T().del)){arr.splice(i,1);if(ty=='h')hd=null}mn=null}}
  else if(d.tk!==undefined){const x=D.tasks[d.tk];x.done=!x.done}
  else if(d.tx!==undefined)D.tasks.splice(d.tx,1);
  else if(d.hd!==undefined)hd=+d.hd;
  else if(d.hb)hd=null;
  else if(d.sc!==undefined){const l=D.habits[hd].sub[d.sc].log;l[sel]?delete l[sel]:l[sel]=1}
  else if(d.sx!==undefined)D.habits[hd].sub.splice(d.sx,1);
  else if(d.tab){tab=d.tab;if(tab=='home')hd=null}
  else if(d.d)sel=d.d;
  else if(d.sd)sd=d.sd;
  else if(d.wk){wk=Math.min(0,wk+ +d.wk);sd=null}
  else if(d.sf)sugF=d.sf;
  else if(d.add){if(!D.habits.some(y=>y.s==d.add||y.k==d.add))D.habits.push({s:d.add,log:{},c:key(new Date())})}
  else if(d.h!==undefined){const l=D.habits[d.h].log;l[sel]?delete l[sel]:l[sel]=1}
  else if(d.go!==undefined)gp.push(+d.go);
  else if(d.gb)gp.pop();
  else if(d.g!==undefined){const x=gl()[d.g];x.d=!x.d;if(x.d&&x.r)toast(T().rewardIs+': '+x.r);if(x.rm)setTimeout(syncRem,0)}
  else if(d.dh!==undefined){if(confirm(T().del))D.habits.splice(d.dh,1)}
  else if(d.dg!==undefined){if(confirm(T().del))gl().splice(d.dg,1)}
  else if(d.th!==undefined)D.theme=+d.th;
  else if(d.l){D.lang=d.l;setTimeout(syncRem,0)}
  else if(d.a=='edit')edit=!edit;
  else if(d.a=='save'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='tracker-backup.json';a.click();return}
  else if(d.a=='load'){document.getElementById('file').click();return}
  else return;
  save();render();
});
app.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,v=f.querySelector('input').value.trim();if(!v)return;
  if(f.dataset.f=='s')D.habits[hd].sub.push({name:v,log:{}});
  else if(f.dataset.f=='t')D.tasks.push({name:v,d:sel,done:false});
  else if(f.dataset.f=='h'){D.habits.push({name:v,i:ni,log:{},c:key(new Date())});ni='sp:46'}
  else{gl().push({name:v,d:false,i:ng,c:[]});ng='sp:28'}
  save();render();
});
app.addEventListener('change',e=>{
  if(e.target.id!='file')return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(j.habits&&j.goals&&confirm(T().replace)){D=j;if(!D.tasks)D.tasks=[];if(!LANGS.some(l=>l[0]==D.lang))D.lang='en';save();render()}}catch(x){alert(T().bad)}};
  r.readAsText(e.target.files[0]);
});
D.habits.forEach(h=>{if(!h.c)h.c=key(new Date())});
if(!D.tasks)D.tasks=[];
setTimeout(()=>{pushWidget();syncRem()},1500);
render();
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
